[project]
name = "document-digitization-ai"
version = "0.1.0"
description = "Backend-first MVP for document digitization, OCR, and form/table structure reconstruction."
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "openai>=2.41.1",
    "pillow>=12.2.0",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.50",
]

[build-system]
requires = ["uv_build>=0.11.10,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
